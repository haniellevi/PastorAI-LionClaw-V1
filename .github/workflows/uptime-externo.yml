name: Uptime externo

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-externo
  cancel-in-progress: false

jobs:
  verificar-endpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verificar endpoints públicos
        run: python3 deploy/monitoring/external_uptime.py
