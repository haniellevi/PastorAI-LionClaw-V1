# Policy-only validation. This workflow never connects to PostgreSQL and never
# treats source verification as a PG17 replay or an operational authorization.
name: Private Runtime Policy V5

on:
  pull_request:
    paths:
      - "backend/scripts/private_runtime_*.py"
      - "backend/scripts/private_runtime_policy_v5_pins.py"
      - "backend/scripts/new_private_runtime_migration.py"
      - "backend/scripts/verify_migration_history_divergence_remediation_proposal_v5.py"
      - "backend/tests/test_private_runtime_migration_policy.py"
      - "docs/governance/migrations/migration-history-divergence-remediation-proposal-v5*"
      - "docs/decisions/2026-09-04-private-runtime-migration-policy-v2.md"
  push:
    branches: [main]
    paths:
      - "backend/scripts/private_runtime_*.py"
      - "backend/scripts/private_runtime_policy_v5_pins.py"
      - "backend/scripts/new_private_runtime_migration.py"
      - "backend/scripts/verify_migration_history_divergence_remediation_proposal_v5.py"
      - "backend/tests/test_private_runtime_migration_policy.py"
      - "docs/governance/migrations/migration-history-divergence-remediation-proposal-v5*"
      - "docs/decisions/2026-09-04-private-runtime-migration-policy-v2.md"

permissions:
  contents: read

jobs:
  source-only-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned offline-test runtime
        working-directory: backend
        run: |
          python -I -S -m venv "$RUNNER_TEMP/private-runtime-venv"
          "$RUNNER_TEMP/private-runtime-venv/bin/python" -I -m pip install --require-hashes -r requirements.lock
      - name: Compile policy-only sources
        run: |
          python3 -I -P -m py_compile \
            backend/scripts/private_runtime_intent_v2.py \
            backend/scripts/new_private_runtime_migration.py \
            backend/scripts/replay_private_runtime_migration_pg17.py \
            backend/scripts/private_runtime_policy_v5_pins.py \
            backend/scripts/verify_migration_history_divergence_remediation_proposal_v5.py
      - name: Run adversarial policy tests only
        working-directory: backend
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          "$RUNNER_TEMP/private-runtime-venv/bin/python" -I -P -m pytest \
            -p no:cacheprovider -o addopts= -q tests/test_private_runtime_migration_policy.py
      - name: Verify blocked V5 source package
        working-directory: backend
        run: |
          set +e
          python3 -I -P scripts/verify_migration_history_divergence_remediation_proposal_v5.py
          status=$?
          test "$status" -eq 8
