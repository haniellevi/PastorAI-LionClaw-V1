# CI dedicado a suite de integracao RLS (PR1 — D5 / SPEC secao 10).
#
# Sobe um Postgres DESCARTAVEL (servico efemero do CI, nunca DEV/PROD), aplica a
# DDL minima (via as fixtures de tests/conftest_rls.py) e roda `pytest -m
# rls_integration`. Sem este job, os testes opt-in ficariam sempre em skip e o
# PR1 viraria cobertura falsa (risco "CI sem Postgres -> T1-T6 sempre skip").
#
# O job FALHA se, com RLS_TEST_DATABASE_URL definida, os testes rls_integration
# nao executarem de fato (0 coletados ou todos skip). Ambiente local/offline sem
# a env var mantem skip limpo — isso e responsabilidade do proprio pytest.
#
# NAO modifica nenhum runtime de producao: usa apenas config de CI + o guard e as
# fixtures de teste ja existentes.
name: RLS Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rls-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres DESCARTAVEL: servico efemero do runner, destruido ao fim do job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # RLS_TEST_DATABASE_URL definida SOMENTE neste job, apontando para o
      # Postgres descartavel efemero (localhost do runner). Nunca DEV/PROD.
      RLS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/rls_disposable

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guard — bloquear DEV/PROD como alvo (reusa feat-002)
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from tests.conftest_rls import assert_disposable_database
          url = os.environ["RLS_TEST_DATABASE_URL"]
          assert_disposable_database(url)  # levanta se aparentar DEV/PROD
          print("guard OK: alvo descartavel")
          PY

      - name: Rodar suite rls_integration (T1-T6 + TOCTOU SEC-4B confirm + approve + transitions + create + W3 arquivamento + W3.2A preflight/archive + MSG-IDEMP-1 + CONSOL-1 consolidação aberta única + FECH-2 reactivate/unarchive + OAuth callback/finish races)
        run: |
          pytest -m rls_integration -o addopts= -rA \
            --junitxml=rls-results.xml \
            tests/test_rls_invariant.py \
            tests/test_events_confirm_toctou.py \
            tests/test_cell_requests_approve_concurrency.py \
            tests/test_cell_requests_transitions_concurrency.py \
            tests/test_cell_requests_create_concurrency.py \
            tests/test_pessoa_arquivamento_migration.py \
            tests/test_pessoa_offboarding_service.py \
            tests/test_messages_inbound_idempotency.py \
            tests/test_consolidacao_open_unique_concurrency.py \
            tests/test_contacts_reactivate_unarchive_concurrency.py \
            tests/test_calendar_oauth_concurrency.py \
            tests/test_v1_m06_hardening_migrations.py

      - name: Rodar test_pessoa_offboarding_router.py (offline, FakeSession — sem marker/Postgres)
        # Sem `-m rls_integration`: os testes deste arquivo não usam Postgres
        # (403/404/422 via FakeSession, mesma técnica de test_team_revoke.py),
        # então não são marcados — e ficariam sem NENHUMA execução em CI se
        # só corressem no passo acima (que filtra por marker).
        run: pytest -o addopts= -rA tests/test_pessoa_offboarding_router.py

      - name: Falhar se T1-T6 nao executaram de fato (0 coletados / todos skip)
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse("rls-results.xml").getroot()
          suites = root.findall("testsuite") or [root]
          total = skipped = failed = errors = 0
          for s in suites:
              total += int(s.get("tests", 0))
              skipped += int(s.get("skipped", 0))
              failed += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
          executed = total - skipped
          print(
              f"total={total} skipped={skipped} executed={executed} "
              f"failed={failed} errors={errors}"
          )
          if total == 0:
              sys.exit("FALHA: 0 testes rls_integration coletados — T1-T6 nao rodaram.")
          if executed == 0:
              sys.exit(
                  "FALHA: todos os testes rls_integration em skip — "
                  "RLS_TEST_DATABASE_URL nao ativou a suite."
              )
          print("OK: suite rls_integration executou de fato.")
          PY
