# CI dedicado a suite de integracao RLS.
#
# Quatro shards usam servicos descartaveis e mantem cada arquivo de teste junto
# por causa das fixtures de modulo. O shard 0 tambem executa os contratos PG17
# de deploy e manutencao. O job final soma os JUnit, valida cobertura por arquivo
# e preserva o nome do check exigido pela main. Nenhum banco DEV/PROD ou efeito
# real e usado por este workflow.
name: RLS Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rls-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-shard:
    name: rls-shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    # Cada shard recebe servicos efemeros independentes, destruidos com o job.
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      F2B_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      # URL definida somente para o Postgres descartavel do runner.
      RLS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/rls_disposable
      S3_MIGRATION_EXACT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/s3_migration_exact_test
      V3_TURN_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_consolidation_test
      V3_DELIVERY_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_delivery_test
      OPERATIONAL_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/obs_d2_test
      UV_TURMAS_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/uv_turmas_test
      MIGRATE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/migrate_lock_test
      V3_WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_workflow_test
      V3_MIGRATION_EXACT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_migration_exact_test
      V2B_MIGRATION_EXACT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v2b_migration_exact_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-ci-ffmpeg.lock

      - name: Criar ambiente runtime limpo (lock e hashes exatos)
        run: |
          python -m venv "$RUNNER_TEMP/backend-runtime-venv"
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip check
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" scripts/verify_manifest_requirements.py requirements.txt

      # Todo shard: o divisor balanceia por contagem, entao qualquer shard pode
      # receber os testes de audio V1b que usam o decodificador real.
      - name: Instalar FFmpeg estatico para audio V1b
        run: |
          runtime_python="$RUNNER_TEMP/backend-runtime-venv/bin/python"
          "$runtime_python" -m pip install --require-hashes --no-deps --only-binary=:all: \
            -r requirements-ci-ffmpeg.lock
          ffmpeg_path="$("$runtime_python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$ffmpeg_path"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sfn "$ffmpeg_path" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          printf '%s\n' "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          command -v prlimit

      - name: Testar o divisor de shards
        if: matrix.shard == 0
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest --strict-markers -v \
            -o faulthandler_timeout=600 -o addopts= -p no:cacheprovider \
            tests/test_ci_test_shards.py

      - name: Guard — bloquear DEV/PROD como alvo (reusa feat-002)
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from tests.conftest_rls import assert_disposable_database
          url = os.environ["RLS_TEST_DATABASE_URL"]
          assert_disposable_database(url)  # levanta se aparentar DEV/PROD
          print("guard OK: alvo descartavel")
          PY

      - name: Criar bancos descartaveis separados para SQL byte-exato
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" - <<'PY'
          import os
          from sqlalchemy import create_engine
          from tests.conftest_rls import assert_disposable_database
          from tests.test_s3_migration_exact_pg import _exact_database_url
          url = os.environ["RLS_TEST_DATABASE_URL"]
          assert_disposable_database(url)
          _exact_database_url()
          engine = create_engine(url, isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.exec_driver_sql("CREATE DATABASE s3_migration_exact_test")
              connection.exec_driver_sql("CREATE DATABASE v2b_migration_exact_test")
              connection.exec_driver_sql("CREATE DATABASE v3_migration_exact_test")
              connection.exec_driver_sql("CREATE DATABASE v3_workflow_test")
              connection.exec_driver_sql("CREATE DATABASE uv_turmas_test")
              connection.exec_driver_sql("CREATE DATABASE migrate_lock_test")
              connection.exec_driver_sql("CREATE DATABASE obs_d2_test")
              connection.exec_driver_sql("CREATE DATABASE v3_delivery_test")
              connection.exec_driver_sql("CREATE DATABASE v3_consolidation_test")
          engine.dispose()
          PY

      - name: Coletar a suite completa e selecionar arquivos do shard
        run: |
          runtime_python="$RUNNER_TEMP/backend-runtime-venv/bin/python"
          "$runtime_python" -m pytest --collect-only -q --strict-markers -m rls_integration \
            -o addopts= -p no:cacheprovider tests > rls-collected.txt
          "$runtime_python" scripts/ci_test_shards.py partition \
            --collection-file rls-collected.txt \
            --shard "${{ matrix.shard }}" \
            --shard-count 4 \
            --manifest-file "rls-shard-${{ matrix.shard }}.json" \
            > "rls-files-${{ matrix.shard }}.txt"

      - name: Rodar arquivos completos do shard
        run: |
          runtime_python="$RUNNER_TEMP/backend-runtime-venv/bin/python"
          mapfile -t shard_files < "rls-files-${{ matrix.shard }}.txt"
          test "${#shard_files[@]}" -gt 0
          "$runtime_python" -m pytest --strict-markers -v -o faulthandler_timeout=600 \
            -m rls_integration -o addopts= -p no:cacheprovider -rA \
            --junitxml="rls-results-${{ matrix.shard }}.xml" \
            "${shard_files[@]}"

      - name: Exercitar preflight de deploy em PG17 descartavel
        if: matrix.shard == 0
        env:
          BACKEND_RELEASE_TEST_DATABASE_URL: ${{ env.RLS_TEST_DATABASE_URL }}
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest -v \
            -o faulthandler_timeout=600 -o addopts= \
            ../deploy/tests/test_backend_schema_pg17.py

      - name: Exercitar contrato legado de manutencao em PG17 descartavel
        if: matrix.shard == 0
        env:
          MAINTENANCE_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maintenance_schema_disposable
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" - <<'PY'
          import psycopg2
          connection = psycopg2.connect(host="127.0.0.1", port=5432, user="postgres", password="postgres", dbname="postgres")
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE maintenance_schema_disposable")
          connection.close()
          PY
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m unittest discover \
            -s ../deploy/tests -p test_maintenance_schema_pg.py -v

      - name: Publicar JUnit e mapa de cobertura do shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rls-shard-${{ matrix.shard }}
          path: |
            backend/rls-results-${{ matrix.shard }}.xml
            backend/rls-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore

  rls-integration:
    name: rls-integration
    needs: rls-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RLS_SHARD_JOB_RESULT: ${{ needs.rls-shard.result }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Baixar resultados dos shards
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: rls-shard-*
          path: backend/rls-artifacts
          merge-multiple: true

      - name: Somar JUnit e verificar cobertura completa
        if: always()
        run: |
          python scripts/ci_test_shards.py verify \
            --artifact-directory rls-artifacts \
            --shard-count 4 \
            --shard-job-result "$RLS_SHARD_JOB_RESULT"
