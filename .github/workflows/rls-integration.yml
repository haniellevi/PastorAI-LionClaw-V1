# CI dedicado a suite de integracao RLS (PR1 — D5 / SPEC secao 10).
#
# Sobe um Postgres DESCARTAVEL (servico efemero do CI, nunca DEV/PROD), aplica a
# DDL minima (via as fixtures de tests/conftest_rls.py) e roda a suite
# `rls_integration`, exceto os guards de replay que exigem um cluster sem roles
# globais e portanto executam exclusivamente no job dedicado de catálogo PG17.
# Sem este job, os testes opt-in ficariam sempre em skip e o PR1 viraria
# cobertura falsa (risco "CI sem Postgres -> T1-T6 sempre skip").
#
# O job FALHA se, com RLS_TEST_DATABASE_URL definida, houver zero testes,
# qualquer skip, falha ou erro na suite selecionada. Ambiente local/offline sem a
# env var mantem skip limpo — isso e responsabilidade do proprio pytest.
#
# NAO modifica nenhum runtime de producao: usa apenas config de CI + o guard e as
# fixtures de teste ja existentes.
name: RLS Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rls-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Postgres DESCARTAVEL: servico efemero do runner, destruido ao fim do job.
    services:
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      F2B_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      # RLS_TEST_DATABASE_URL definida SOMENTE neste job, apontando para o
      # Postgres descartavel efemero (loopback literal do runner). Nunca DEV/PROD.
      RLS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/rls_disposable
      S3_MIGRATION_EXACT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/s3_migration_exact_test
      V3_TURN_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_consolidation_test
      V3_DELIVERY_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_delivery_test
      V3_WORKFLOW_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_workflow_test
      V3_MIGRATION_EXACT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v3_migration_exact_test
      V2B_MIGRATION_EXACT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/v2b_migration_exact_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar decodificador V1b limitado
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes ffmpeg util-linux

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Criar ambiente runtime limpo (lock e hashes exatos)
        run: |
          python -m venv "$RUNNER_TEMP/backend-runtime-venv"
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip check
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" scripts/verify_manifest_requirements.py requirements.txt

      - name: Guard — bloquear DEV/PROD como alvo (reusa feat-002)
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          from tests.conftest_rls import assert_disposable_database
          url = os.environ["RLS_TEST_DATABASE_URL"]
          assert_disposable_database(url)  # levanta se aparentar DEV/PROD
          print("guard OK: alvo descartavel")
          PY

      - name: Criar bancos descartaveis separados para SQL byte-exato
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" - <<'PY'
          import os
          from sqlalchemy import create_engine
          from tests.conftest_rls import assert_disposable_database
          from tests.test_s3_migration_exact_pg import _exact_database_url
          url = os.environ["RLS_TEST_DATABASE_URL"]
          assert_disposable_database(url)
          _exact_database_url()
          engine = create_engine(url, isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.exec_driver_sql("CREATE DATABASE s3_migration_exact_test")
              connection.exec_driver_sql("CREATE DATABASE v2b_migration_exact_test")
              connection.exec_driver_sql("CREATE DATABASE v3_migration_exact_test")
              connection.exec_driver_sql("CREATE DATABASE v3_workflow_test")
              connection.exec_driver_sql("CREATE DATABASE v3_delivery_test")
              connection.exec_driver_sql("CREATE DATABASE v3_consolidation_test")
          engine.dispose()
          PY

      - name: Rodar a suite marcada rls_integration fora dos guards de replay fresco
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest --strict-markers \
            -m rls_integration -o addopts= -p no:cacheprovider -rA \
            --junitxml=rls-results.xml \
            tests

      - name: Exercitar preflight de deploy em PG17 descartável
        env:
          BACKEND_RELEASE_TEST_DATABASE_URL: ${{ env.RLS_TEST_DATABASE_URL }}
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest -q \
            ../deploy/tests/test_backend_schema_pg17.py

      - name: Exercitar contrato legado de manutenção em PG17 descartável
        env:
          MAINTENANCE_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/maintenance_schema_disposable
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" - <<'PY'
          import psycopg2
          connection = psycopg2.connect(host="127.0.0.1", port=5432, user="postgres", password="postgres", dbname="postgres")
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute("CREATE DATABASE maintenance_schema_disposable")
          connection.close()
          PY
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m unittest discover \
            -s ../deploy/tests -p test_maintenance_schema_pg.py -v

      - name: Verificar execucao integral da suite RLS
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" - <<'PY'
          import sys, xml.etree.ElementTree as ET

          root = ET.parse("rls-results.xml").getroot()
          suites = root.findall("testsuite") or [root]
          total = skipped = failed = errors = 0
          for s in suites:
              total += int(s.get("tests", 0))
              skipped += int(s.get("skipped", 0))
              failed += int(s.get("failures", 0))
              errors += int(s.get("errors", 0))
          executed = total - skipped
          print(
              f"total={total} skipped={skipped} executed={executed} "
              f"failed={failed} errors={errors}"
          )
          if total == 0:
              sys.exit("FALHA: 0 testes rls_integration coletados — T1-T6 nao rodaram.")
          if executed == 0:
              sys.exit(
                  "FALHA: todos os testes rls_integration selecionados em skip — "
                  "RLS_TEST_DATABASE_URL nao ativou a suite."
              )
          if skipped != 0:
              sys.exit(
                  "FALHA: houve skip parcial na suite rls_integration selecionada; "
                  "todo teste selecionado deve executar no Postgres descartavel."
              )
          if failed != 0 or errors != 0:
              sys.exit("FALHA: suite rls_integration registrou falha ou erro.")
          print("OK: suite rls_integration selecionada executou de fato.")
          PY
