# CI do frontend (FRONTEND-CI-1).
#
# O frontend ja possuia quatro gates (`lint`, `typecheck`, `test`, `build`) em
# `frontend/package.json`, mas `.github/workflows/` so tinha jobs de backend
# (`backend-tests.yml`) e de RLS (`rls-integration.yml`): nenhuma regressao de
# frontend era barrada em PR — os gates so rodavam se alguem lembrasse de
# executa-los na maquina local.
#
# Este job apenas EXECUTA os scripts que ja existem, na mesma ordem em que sao
# rodados localmente. Nao altera `package.json`/`package-lock.json`, nao mexe
# nos workflows existentes e nao define nenhuma variavel de ambiente: o
# `next build` deste projeto conclui sem credencial (verificado com o lockfile
# atual), entao nao ha secret a injetar nem valor falso a inventar.
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile exato)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build de producao
        run: npm run build
