# CI do frontend (FRONTEND-CI-1).
#
# O frontend ja possuia quatro gates (`lint`, `typecheck`, `test`, `build`) em
# `frontend/package.json`, mas `.github/workflows/` so tinha jobs de backend
# (`backend-tests.yml`) e de RLS (`rls-integration.yml`): nenhuma regressao de
# frontend era barrada em PR — os gates so rodavam se alguem lembrasse de
# executa-los na maquina local.
#
# Este job apenas EXECUTA os scripts que ja existem, na mesma ordem em que sao
# rodados localmente. Nao altera `package.json`/`package-lock.json` e nao mexe
# nos workflows existentes. O `next build` conclui sem credencial; a unica
# variavel e `NEXT_PUBLIC_API_URL`, que o build de producao exige
# (`src/lib/api-base.ts`). Aqui ela recebe um endereco sintetico `.test`, que
# nao resolve e nao aponta para nenhum ambiente real.
name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile exato)
        run: npm ci

      - name: Auditar dependencias de producao
        run: npm audit --omit=dev --audit-level=high

      # Informativo: inclui as dependencias de desenvolvimento (lint, testes,
      # build), que o passo acima nao enxerga. Em 12/11 havia 1 alerta alto
      # (undici, via jsdom) sem correcao automatica, entao nao bloqueia.
      # Quando zerar, trocar para bloqueante: remover continue-on-error.
      - name: Auditar dependencias de desenvolvimento (informativo)
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/npm-audit-dev.txt"
          status=${PIPESTATUS[0]}
          {
            echo "### npm audit completo (com dev), frontend"
            echo
            if [ "$status" -eq 0 ]; then
              echo "Nenhum alerta alto ou critico."
            else
              echo "Alertas altos ou criticos encontrados (informativo, nao bloqueia):"
              echo
              echo '```'
              head -n 60 "$RUNNER_TEMP/npm-audit-dev.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Lint
        run: npm run lint

      # Corrigir localmente: cd frontend && npm run format
      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tipos da API gerados do openapi.json do backend
        run: npm run api:types:check

      - name: Testes (Vitest)
        run: npm test

      - name: Build de producao
        env:
          NEXT_PUBLIC_API_URL: https://synthetic-api.example.test
        run: npm run build

      - name: Smoke HTTP real dos headers de seguranca
        run: node smoke-security-headers.mjs
