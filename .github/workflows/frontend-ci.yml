# CI do frontend (FRONTEND-CI-1).
#
# O frontend ja possuia quatro gates (`lint`, `typecheck`, `test`, `build`) em
# `frontend/package.json`, mas `.github/workflows/` so tinha jobs de backend
# (`backend-tests.yml`) e de RLS (`rls-integration.yml`): nenhuma regressao de
# frontend era barrada em PR — os gates so rodavam se alguem lembrasse de
# executa-los na maquina local.
#
# Este job apenas EXECUTA os scripts que ja existem, na mesma ordem em que sao
# rodados localmente. Nao altera `package.json`/`package-lock.json`, nao mexe
# nos workflows existentes e nao define nenhuma variavel de ambiente: o
# `next build` deste projeto conclui sem credencial (verificado com o lockfile
# atual), entao nao ha secret a injetar nem valor falso a inventar.
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile exato)
        run: npm ci

      - name: Auditar dependencias de producao
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build de producao
        run: npm run build

      - name: Smoke HTTP real dos headers de seguranca
        run: node smoke-security-headers.mjs
