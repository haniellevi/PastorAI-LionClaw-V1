# O stream privado e um artefato separado do catalogo V1. Este workflow
# sempre executa os dois proofs: o job source preserva o replay historico V1
# autenticado, e o job terminal usa PG17 descartavel para o stream privado.
# Nenhum job usa banco compartilhado, segredo de ambiente, DEV ou PROD.
name: Private Runtime Catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: private-runtime-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-runtime-source:
    name: Authenticated V1 + private source proof
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Verificar V1 historico e stream privado em snapshots autenticados
        env:
          PRIVATE_RUNTIME_CURRENT_SHA: ${{ github.sha }}
          PRIVATE_RUNTIME_EVENT_NAME: ${{ github.event_name }}
          PRIVATE_RUNTIME_PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PRIVATE_RUNTIME_PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -I -P -B \
            backend/scripts/verify_private_runtime_catalog_ci.py \
            --event-name "$PRIVATE_RUNTIME_EVENT_NAME" \
            --current-sha "$PRIVATE_RUNTIME_CURRENT_SHA" \
            --pull-request-base-sha "$PRIVATE_RUNTIME_PR_BASE_SHA" \
            --push-before-sha "$PRIVATE_RUNTIME_PUSH_BEFORE_SHA"

  private-runtime-pg17:
    name: Disposable PG17 private replay
    needs: private-runtime-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_catalog_current_head_disposable
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_catalog_current_head_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Criar runtime Python fixado pelo lockfile
        run: |
          set -euo pipefail
          python -I -S -m venv "$RUNNER_TEMP/private-runtime-venv"
          "$RUNNER_TEMP/private-runtime-venv/bin/python" -I -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/private-runtime-venv/bin/python" -I -m pip check

      - name: Guardar checkout somente leitura antes do replay
        working-directory: .
        run: chmod -R a-w -- "$GITHUB_WORKSPACE"

      - name: Reproduzir V1 historico + stream privado em PG17 descartavel
        env:
          MIGRATION_PRIVATE_RUNTIME_REPLAY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/migration_catalog_current_head_disposable
          PRIVATE_RUNTIME_REPLAY_HEAD: docs/governance/migrations/private-runtime-catalog-head-v1.json
          PRIVATE_RUNTIME_REPLAY_DIRECTORY: backend/migrations/private_runtime
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/private-runtime-pg17.receipt"
          "$RUNNER_TEMP/private-runtime-venv/bin/python" -I -P \
            scripts/replay_private_runtime_catalog_pg17.py \
            --catalog-head "$PRIVATE_RUNTIME_REPLAY_HEAD" \
            --private-directory "$PRIVATE_RUNTIME_REPLAY_DIRECTORY" \
            --confirmation REPLAY_PRIVATE_RUNTIME_CATALOG_PG17_DISPOSABLE \
            > "$receipt"
          test "$(wc -c < "$receipt")" -le 16384

      - name: Exigir receipt de replay real, isolamento e estado final fechado
        env:
          PRIVATE_RUNTIME_RECEIPT: ${{ runner.temp }}/private-runtime-pg17.receipt
          PRIVATE_RUNTIME_REPLAY_HEAD: docs/governance/migrations/private-runtime-catalog-head-v1.json
          PRIVATE_RUNTIME_REPLAY_DIRECTORY: backend/migrations/private_runtime
        run: |
          set -euo pipefail
          python -I -S scripts/verify_private_runtime_pg17_receipt.py \
            --receipt "$PRIVATE_RUNTIME_RECEIPT" \
            --catalog-head "$PRIVATE_RUNTIME_REPLAY_HEAD" \
            --private-directory "$PRIVATE_RUNTIME_REPLAY_DIRECTORY"

      - name: Restaurar permissao do checkout ao finalizar o job
        if: ${{ always() }}
        working-directory: .
        run: chmod -R u+w -- "$GITHUB_WORKSPACE" || true

  private-runtime-projection-pg17:
    name: Disposable PG17 private projection adversaries
    needs: private-runtime-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: private_runtime_projection_disposable
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d private_runtime_projection_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RLS_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/private_runtime_projection_disposable

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Criar runtime Python fixado pelo lockfile
        run: |
          set -euo pipefail
          python -I -S -m venv "$RUNNER_TEMP/private-runtime-projection-venv"
          "$RUNNER_TEMP/private-runtime-projection-venv/bin/python" -I -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/private-runtime-projection-venv/bin/python" -I -m pip check

      - name: Guardar alvo loopback antes de qualquer DDL
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/private-runtime-projection-venv/bin/python" - <<'PY'
          import os
          import sys
          sys.path.insert(0, ".")
          from tests.conftest_rls import assert_disposable_database
          assert_disposable_database(os.environ["RLS_TEST_DATABASE_URL"])
          PY

      - name: Executar exatamente os 11 casos PG17 da projeção privada
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/private-runtime-projection-pg17.xml"
          "$RUNNER_TEMP/private-runtime-projection-venv/bin/python" -m pytest \
            --strict-markers -o xfail_strict=true -rA \
            --junitxml="$report" \
            tests/test_private_runtime_projection_pg17.py::test_private_runtime_projection_pg17 \
            tests/test_private_runtime_projection_pg17.py::test_private_runtime_projection_security_adversaries \
            tests/test_private_runtime_projection_pg17.py::test_private_runtime_projection_rollback_atomicity

      - name: Rejeitar skips, xfails ou coleta parcial dos 11 casos
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/private-runtime-projection-pg17.xml"
          "$RUNNER_TEMP/private-runtime-projection-venv/bin/python" - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall("testsuite") or [root]
          total = skipped = failed = errors = 0
          cases = []
          for suite in suites:
              total += int(suite.get("tests", 0))
              skipped += int(suite.get("skipped", 0))
              failed += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              cases.extend(suite.findall("testcase"))
          print(
              f"total={total} cases={len(cases)} skipped={skipped} "
              f"failed={failed} errors={errors}"
          )
          if total != 11 or len(cases) != 11:
              raise SystemExit("FALHA: a matriz PG17 da projeção não executou 11 casos")
          if skipped or failed or errors:
              raise SystemExit("FALHA: casos PG17 tiveram skip, xfail ou erro")
          if any(
              case.find("skipped") is not None
              or case.find("failure") is not None
              or case.find("error") is not None
              for case in cases
          ):
              raise SystemExit("FALHA: JUnit contém caso não executado ou falho")
          print("OK: 11 casos PG17 executados no PostgreSQL descartável")
