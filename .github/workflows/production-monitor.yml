name: Production monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  public-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe public production endpoints
        id: probe
        continue-on-error: true
        run: python3 deploy/monitoring/external_probe.py

      - name: Maintain one deduplicated incident issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const { maintainIncident } = require('./deploy/monitoring/maintain_incident.js');
            await maintainIncident({
              github,
              context,
              probeOutcome: process.env.PROBE_OUTCOME,
            });

      - name: Fail workflow when production is unhealthy
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: python3 deploy/monitoring/assert_probe_healthy.py
