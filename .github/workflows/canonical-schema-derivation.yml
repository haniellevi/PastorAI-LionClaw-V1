name: Canonical Schema Derivation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-schema-derivation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-schema-derivation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres_a:
        image: postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canonical_schema_disposable_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canonical_schema_disposable_a"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres_b:
        image: postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canonical_schema_disposable_b
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canonical_schema_disposable_b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Instalar runtime fixado pelo lockfile
        run: |
          python -m venv "$RUNNER_TEMP/backend-runtime-venv"
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip check
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" scripts/verify_manifest_requirements.py requirements.txt

      - name: Testar guardas e contrato offline
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest \
            -p no:cacheprovider -o addopts= -q --tb=short \
            tests/test_migration_history_canonical_schema_derivation.py

      - name: Preparar layouts privados dos dois replays
        run: |
          install -d -m 700 "$RUNNER_TEMP/canonical-schema-a"
          install -d -m 700 "$RUNNER_TEMP/canonical-schema-b"

      - name: Replay fresh A em PostgreSQL 17
        env:
          CANONICAL_SCHEMA_DERIVATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/canonical_schema_disposable_a
          CANONICAL_SCHEMA_DERIVATION_TEST_OUTPUT_DIR: ${{ runner.temp }}/canonical-schema-a
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest \
            -p no:cacheprovider -o addopts= -q --tb=short \
            tests/test_migration_history_canonical_schema_pg17.py

      - name: Replay fresh B em PostgreSQL 17
        env:
          CANONICAL_SCHEMA_DERIVATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/canonical_schema_disposable_b
          CANONICAL_SCHEMA_DERIVATION_TEST_OUTPUT_DIR: ${{ runner.temp }}/canonical-schema-b
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest \
            -p no:cacheprovider -o addopts= -q --tb=short \
            tests/test_migration_history_canonical_schema_pg17.py

      - name: Verificar determinismo e bloqueio operacional
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/backend-runtime-venv/bin/python" \
            scripts/verify_migration_history_canonical_schema.py \
            --artifact-a "$RUNNER_TEMP/canonical-schema-a/migration-history-canonical-schema-derivation-v1.json" \
            --artifact-b "$RUNNER_TEMP/canonical-schema-b/migration-history-canonical-schema-derivation-v1.json"

      - name: Preservar artefato sanitizado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-schema-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-schema-a/migration-history-canonical-schema-derivation-v1.json
          if-no-files-found: error
          retention-days: 14
