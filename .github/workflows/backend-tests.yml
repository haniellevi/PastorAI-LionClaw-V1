# CI dedicado a suite backend offline (CI-1), separado do job de RLS Integration.
#
# Ate aqui so `rls-integration.yml` rodava em CI — ele cobre apenas os testes
# marcados `rls_integration` (opt-in, exigem Postgres). Os ~1240 testes restantes
# (rotas, servicos, RBAC, validacao, etc.) sao 100% offline (fakes/monkeypatch,
# sem Postgres/Redis/Supabase/Clerk reais — ver backend/tests/conftest.py) mas
# nao tinham NENHUM job proprio: passavam local e so seriam vistos no CI se
# alguem rodasse manualmente.
#
# Este job roda exatamente a suite complementar (`-m "not rls_integration"`).
# A suite backend offline nao toca banco/rede real; o passo separado de
# inventario de release usa PG17 descartavel sem rede nem porta publicada.
# Falha em regressao via exit code nativo do pytest (falha de teste = exit 1;
# 0 testes selecionados por erro de marker/coleta = exit 5) — sem guard custom.
#
# NAO modifica o job rls-integration nem qualquer runtime de producao: so
# adiciona config de CI + reusa a suite de teste ja existente.
name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O adaptador verifica SQL e executor pelos commits revisados.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-audit.lock
            backend/requirements-ci-ffmpeg.lock

      - name: Criar ambiente runtime limpo (lock e hashes exatos)
        run: |
          python -m venv "$RUNNER_TEMP/backend-runtime-venv"
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pip check
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" scripts/verify_manifest_requirements.py requirements.txt

      - name: Instalar FFmpeg estático para áudio V1b
        run: |
          runtime_python="$RUNNER_TEMP/backend-runtime-venv/bin/python"
          "$runtime_python" -m pip install --require-hashes --no-deps --only-binary=:all: \
            -r requirements-ci-ffmpeg.lock
          ffmpeg_path="$("$runtime_python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$ffmpeg_path"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sfn "$ffmpeg_path" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          # O teste de fronteira do decodificador V1b usa o caminho da imagem de produção.
          sudo ln -sfn "$ffmpeg_path" /usr/bin/ffmpeg
          printf '%s\n' "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          command -v prlimit

      - name: Criar ambiente de auditoria limpo e auditar
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip install --require-hashes -r requirements-audit.lock
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip check
          "$RUNNER_TEMP/pip-audit-venv/bin/python" scripts/verify_manifest_requirements.py requirements-audit.in
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip_audit --require-hashes --disable-pip -r requirements.lock
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip_audit --require-hashes --disable-pip -r requirements-audit.lock

      - name: Verificar erros estáticos no backend (Ruff)
        working-directory: .
        run: PATH="$RUNNER_TEMP/pip-audit-venv/bin:$PATH" ruff check backend

      - name: Build da imagem backend (sem publicar)
        run: docker build --tag pastorai-backend:ci .

      - name: Validar A3 parametrizado com testes exclusivamente simulados
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          set -euo pipefail
          umask 022
          "$RUNNER_TEMP/pip-audit-venv/bin/ruff" check --no-cache \
            deploy/first_transition_host_driver.py deploy/first_transition_database.py \
            deploy/first_transition_candidate.py deploy/first_transition_orchestrator.py \
            deploy/first_transition_host_contract.py deploy/first_transition_host_transport.py \
            deploy/first_transition_adapter.py deploy/initial_transition_files.py deploy/package_backend_release.py \
            deploy/tests/test_first_transition_host_driver.py deploy/tests/test_first_transition_database.py \
            deploy/tests/test_first_transition_orchestrator.py deploy/tests/test_first_transition_host_contract.py \
            deploy/first_transition_window.py deploy/first_transition_window_backup.py \
            deploy/first_transition_native_v2.py deploy/first_transition_native_v3.py \
            deploy/first_transition_native_v3_compare.py deploy/first_transition_native_settings.py \
            deploy/first_transition_native_readers.py deploy/first_transition_native_job.py \
            deploy/first_transition_native_factory.py deploy/rehearse_native_window.py \
            deploy/first_transition_native_events.py deploy/first_transition_native_transports.py \
            deploy/first_transition_native_candidate_ca.py deploy/first_transition_native_candidate_bootstrap.py \
            deploy/first_transition_native_joint.py deploy/first_transition_native_joint_artifacts.py \
            deploy/first_transition_native_joint_capture.py deploy/first_transition_native_http_reader.py \
            deploy/first_transition_native_http_hook.py \
            deploy/first_transition_native_candidate_admission.py deploy/first_transition_native_candidate_runtime.py \
            deploy/first_transition_native_supervision.py deploy/tests/test_first_transition_native_supervision.py \
            deploy/first_transition_native_cleanup.py deploy/first_transition_native_gates.py deploy/first_transition_native_dispatch.py deploy/first_transition_native_outer.py deploy/first_transition_native_fence.py \
            deploy/tests/test_first_transition_native_cleanup.py deploy/tests/test_first_transition_native_gates.py deploy/tests/test_first_transition_native_dispatch.py deploy/tests/test_first_transition_native_outer.py deploy/tests/test_first_transition_native_fence.py \
            deploy/tests/test_first_transition_native_candidate_admission.py deploy/tests/test_first_transition_native_candidate_runtime.py \
            deploy/tests/test_first_transition_native_candidate_ca.py \
            deploy/tests/test_first_transition_native_joint.py deploy/tests/test_first_transition_native_joint_artifacts.py \
            deploy/first_transition_origin.py deploy/first_transition_capture_contract.py deploy/first_transition_auth_preflight.py \
            deploy/tests/test_first_transition_origin.py deploy/tests/test_first_transition_auth_preflight.py \
            deploy/tests/test_first_transition_native_job.py \
            deploy/tests/test_first_transition_native_factory.py deploy/tests/test_rehearse_native_window.py \
            deploy/tests/test_first_transition_native_events.py deploy/tests/test_first_transition_native_transports.py \
            deploy/tests/test_first_transition_native_readers.py \
            deploy/tests/test_first_transition_native_worker.py \
            deploy/tests/test_first_transition_native_snapshot.py \
            deploy/tests/test_first_transition_native_artifacts.py \
            deploy/tests/test_first_transition_origin_window.py \
            deploy/first_transition_window_bindings.py deploy/tests/first_transition_bridge_netns.py \
            deploy/tests/test_first_transition_window_backup.py deploy/tests/test_first_transition_window_bindings.py \
            deploy/tests/test_first_transition_window_backup_docker.py \
            deploy/tests/test_first_transition_candidate_writers.py deploy/tests/test_first_transition_window_entry.py \
            deploy/tests/test_first_transition_candidate_network.py \
            deploy/tests/test_first_transition_candidate_network_docker.py \
            deploy/tests/test_first_transition_libpq_environment.py \
            deploy/check_integrated_candidate.py deploy/tests/test_candidate_ci_checks.py \
            deploy/check_c2_integration.py \
            deploy/first_transition_c2_adapter.py \
            deploy/first_transition_c2_containment.py \
            deploy/first_transition_c2_cron.py \
            deploy/first_transition_c2_guards.py \
            deploy/first_transition_c2_lifecycle.py \
            deploy/first_transition_c2_native.py \
            deploy/first_transition_c2_systemctl.py \
            deploy/tests/c2_lifecycle_fixture.py \
            deploy/tests/test_check_c2_integration.py \
            deploy/tests/test_first_transition_c2_containment.py \
            deploy/tests/test_first_transition_c2_cron.py \
            deploy/tests/test_first_transition_c2_guards.py \
            deploy/tests/test_first_transition_c2_lifecycle.py \
            deploy/tests/test_first_transition_c2_lifecycle_vertical.py \
            deploy/tests/test_first_transition_c2_native.py \
            deploy/tests/test_first_transition_c2_native_integration.py \
            deploy/tests/test_first_transition_c2_schedule_integration.py \
            deploy/tests/test_first_transition_c2_systemctl.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest -q -p no:cacheprovider \
            deploy/tests/test_first_transition_native_cleanup.py deploy/tests/test_first_transition_native_gates.py deploy/tests/test_first_transition_native_dispatch.py deploy/tests/test_first_transition_native_outer.py deploy/tests/test_first_transition_native_fence.py \
            deploy/tests/test_first_transition_native_supervision.py \
            deploy/tests/test_first_transition_native_candidate_admission.py deploy/tests/test_first_transition_native_candidate_runtime.py \
            deploy/tests/test_first_transition_native_candidate_ca.py \
            deploy/tests/test_first_transition_native_joint.py deploy/tests/test_first_transition_native_joint_artifacts.py \
            deploy/tests/test_first_transition_host_driver.py deploy/tests/test_first_transition_host_contract.py \
            deploy/tests/test_first_transition_adapter.py deploy/tests/test_first_transition_commands.py \
            deploy/tests/test_initial_transition.py deploy/tests/test_initial_transition_layout.py \
            deploy/tests/test_backend_release_package.py deploy/tests/test_release_topology.py \
            deploy/tests/test_first_transition_database.py deploy/tests/test_first_transition_orchestrator.py \
            deploy/tests/test_backend_workflow.py deploy/tests/test_first_transition_window_backup.py \
            deploy/tests/test_first_transition_window_bindings.py \
            deploy/tests/test_first_transition_candidate_writers.py deploy/tests/test_first_transition_window_entry.py \
            deploy/tests/test_first_transition_candidate_network.py \
            deploy/tests/test_first_transition_candidate_network_docker.py \
            deploy/tests/test_first_transition_libpq_environment.py \
            deploy/tests/test_first_transition_origin.py deploy/tests/test_first_transition_auth_preflight.py \
            deploy/tests/test_first_transition_native_job.py \
            deploy/tests/test_first_transition_native_factory.py deploy/tests/test_rehearse_native_window.py \
            deploy/tests/test_first_transition_native_events.py deploy/tests/test_first_transition_native_transports.py \
            deploy/tests/test_first_transition_native_readers.py \
            deploy/tests/test_first_transition_native_worker.py \
            deploy/tests/test_first_transition_native_snapshot.py \
            deploy/tests/test_first_transition_native_artifacts.py \
            deploy/tests/test_first_transition_origin_window.py
      - name: Validate isolated C2 integration capsule
        working-directory: .
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -I -B - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, sys, tempfile
          root = Path.cwd()
          checker = root / 'deploy/check_c2_integration.py'
          contract = root / 'deploy/c2-candidate-interface.json'
          expected_checker = '9cc6448b0435c5005a03c3d0256fdacc4215ac43e6176ba8b1abbc124ed2c675'
          expected_contract = 'ad3c6da5e08bb06543c8047fadb634455f897f4fa3c122a9fdd658d3736e50aa'
          assert hashlib.sha256(checker.read_bytes()).hexdigest() == expected_checker
          assert hashlib.sha256(contract.read_bytes()).hexdigest() == expected_contract
          env = dict(PATH='/usr/local/bin:/usr/bin:/bin', LC_ALL='C.UTF-8',
                     PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', PYTHON_DOTENV_DISABLED='1',
                     PYTHONDONTWRITEBYTECODE='1')
          def verify(source):
              subprocess.run([sys.executable, '-I', '-B', str(checker), '--source-root', str(source),
                              '--contract', str(contract), '--expect-contract-sha256', expected_contract],
                             env=env, check=True)
          verify(root)
          body = json.loads(contract.read_bytes())
          with tempfile.TemporaryDirectory(prefix='i12-c2-ci-', dir='/tmp') as temporary:
              capsule = Path(temporary)
              for name, pin in body['files'].items():
                  raw = (root / name).read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == pin
                  target = capsule / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
              (capsule / 'deploy/c2-candidate-interface.json').write_bytes(contract.read_bytes())
              verify(capsule)
              tests = sorted(name for name in body['files'] if name.startswith('deploy/tests/test_'))
              subprocess.run([sys.executable, '-I', '-B', '-m', 'pytest', '-q', '--tb=short',
                              '-p', 'no:cacheprovider', '--rootdir='+str(capsule),
                              '--confcutdir='+str(capsule), '--basetemp', str(capsule/'temporary'), *tests],
                             cwd=capsule, env=env, check=True)
          PY

      - name: Validar fronteiras da fence com Storage e PG simulados
        working-directory: .
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          "$RUNNER_TEMP/pip-audit-venv/bin/ruff" check deploy/tests/test_writer_fence_boundaries.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -I -B -m pytest -q --tb=short \
            -p no:cacheprovider --rootdir=. --confcutdir=. deploy/tests/test_writer_fence_boundaries.py

      - name: Validar adaptador da primeira transição em PG17 descartável
        working-directory: .
        run: |
          set -euo pipefail
          umask 022
          # Ferramentas somente no runner efêmero; sem credenciais de ambiente.
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_dump || ! -x /usr/lib/postgresql/17/bin/pg_restore ]]; then
            # Ubuntu 24.04 fornece PG16; PG17 vem do repositório oficial PGDG.
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --show-error --silent --location \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            printf '%s\n' \
              'Types: deb' \
              'URIs: https://apt.postgresql.org/pub/repos/apt' \
              'Suites: noble-pgdg' \
              'Components: main' \
              'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
              | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client-17
          fi
          pg_image=postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          docker pull "$pg_image"
          docker tag "$pg_image" postgres:17.6
          "$RUNNER_TEMP/pip-audit-venv/bin/ruff" check \
            deploy/first_transition_adapter.py deploy/first_transition_local_backup.py \
            deploy/first_transition_host_contract.py deploy/first_transition_host_transport.py \
            deploy/rehearse_first_transition_database.py deploy/rehearse_first_transition_commands.py \
            deploy/tests/test_first_transition_adapter.py deploy/tests/test_first_transition_adapter_pg.py \
            deploy/tests/test_first_transition_host_contract.py deploy/tests/test_first_transition_commands.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" deploy/rehearse_first_transition_database.py \
            --python "$RUNNER_TEMP/backend-runtime-venv/bin/python"

      - name: Rodar suite backend offline (tudo exceto rls_integration)
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest -m "not rls_integration" --durations=25

      - name: Rodar testes do monitor de produção
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest ../deploy/monitoring/tests
          node --test ../deploy/monitoring/tests/maintain_incident.test.js

      - name: Validar pacote real do SHA do CI (sem executar backend empacotado)
        env:
          PACKAGE_SHA: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" ../deploy/package_backend_release.py \
            --repo .. --sha "$PACKAGE_SHA" --output "$RUNNER_TEMP/reviewed-backend-package.tar.gz"
          rm -- "$RUNNER_TEMP/reviewed-backend-package.tar.gz"

      - name: Validar cortes e rollback do deploy manual
        run: |
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest ../deploy/tests/test_backend_release_package.py \
            ../deploy/tests/test_backend_workflow.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest ../deploy/tests/test_backend_release.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest ../deploy/tests/test_release_topology.py \
            ../deploy/tests/test_release_topology_compose.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest ../deploy/tests/test_dev_coordination.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m pytest ../deploy/tests/test_dev_pipeline.py \
            ../deploy/tests/test_candidate_ci_checks.py
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m unittest discover -s ../deploy/tests -p test_maintenance_schema.py -v
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m unittest discover -s ../deploy/tests -p test_maintenance_release.py -v

      - name: Validar inventário read-only do release em PG17 isolado
        env:
          BACKEND_INVENTORY_PG17_SYNTHETIC: "1"
        run: |
          set -euo pipefail
          container=igreja12-predispatch-pg17-synthetic
          docker run -d --rm --name "$container" --network none \
            --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_DB=rls_disposable -e POSTGRES_PASSWORD=synthetic-ci-only \
            postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
          trap 'docker stop "$container" >/dev/null' EXIT
          ready=false
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -U postgres -d rls_disposable >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          "$RUNNER_TEMP/backend-runtime-venv/bin/python" -m unittest discover \
            -s ../deploy/tests -p test_backend_inventory_pg17.py -v
