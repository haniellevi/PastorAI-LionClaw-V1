name: E2E Critical

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-critical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-critical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do lockfile
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build local atribuído ao SHA do workflow
        run: npm run build:e2e

      - name: Gates E2E críticos e orçamento de navegação
        run: npm run test:e2e:run

      - name: Preservar relatório e medições
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-critical-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: error
          retention-days: 14
