name: E2E Critical

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-critical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-critical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do lockfile
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build local atribuído ao SHA do workflow
        run: npm run build:e2e

      - name: Gates E2E críticos e orçamento de navegação
        run: npm run test:e2e:run

      - name: Preservar relatório e medições
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-critical-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: error
          retention-days: 14
