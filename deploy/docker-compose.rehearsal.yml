# Only controller-owned disposable PostgreSQL; no remote address or port.
services:
  postgres:
    image: postgres:17.6-trixie@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: rls_disposable
    labels: {pastorai.scope: dev-sintetico}
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 2s
      retries: 30
  control:
    environment:
      REHEARSAL_FRESH_DATABASE: ${REHEARSAL_FRESH_DATABASE:-false}

networks:
  default:
    internal: true
