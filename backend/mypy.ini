# Checagem de tipos do backend (PR 9 do plano de qualidade de 11/11/2026).
#
# Começa por poucas pastas. Uma pasta ou arquivo entra na lista quando for
# tocado e ficar sem erro; nada é corrigido em massa.
#
# Rodar em backend/, com o mypy do lock de ferramentas (requirements-audit.lock)
# lendo os pacotes do ambiente runtime (ambientes de DEPENDENCY_LOCKING.md):
#   .venv-audit/bin/mypy --python-executable .venv-runtime/bin/python
[mypy]
python_version = 3.13
files =
    app/datas.py,
    app/config.py,
    app/deps.py,
    app/performance.py,
    app/db,
    app/domain,
    app/middleware,
    app/visits,
    app/prayer,
    app/cell_suggest,
    app/private_erasure

# Dívida conhecida em app/domain: saem desta lista quando forem tocados.
# e4b_consent e consent_evidence_store são removidos pela PR #651.
exclude = (?x)^app/domain/(
        cell_report_workflow
        | cell_report_snapshot
        | cell_report_legacy_snapshot
        | cell_report_pending_proposal
        | cell_report_v1a
        | e4b_consent
        | consent_evidence_store
    )\.py$

# Módulos fora da lista são lidos para conhecer os tipos, sem reportar erros.
follow_imports = silent
check_untyped_defs = True
strict_equality = True
warn_unused_ignores = True
warn_redundant_casts = True
