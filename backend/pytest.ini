[pytest]
testpaths = tests
pythonpath = .
# The repository lives under a OneDrive-synchronised worktree on Windows.
# pytest's cache provider can block indefinitely in tempfile.mkdtemp during
# session teardown there; the suite does not use lastfailed/stepwise, so keep
# runs deterministic by disabling that optional cache.
addopts = -q -p no:cacheprovider
markers =
    rls_integration: testes que exigem Postgres real (RLS_TEST_DATABASE_URL)
